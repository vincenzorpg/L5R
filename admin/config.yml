backend:
  name: github
  repo: vincenzorpg/L5R
  branch: main

media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "scenarios"
    label: "Scénarios & Campagne"
    folder: "content/scenarios"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Numéro ou Tag", name: "episode_num", widget: "string" }
      - { label: "Titre du Scénario", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Narrateur", name: "author", widget: "string", default: "MJ David" }
      - { label: "Résumé court", name: "summary", widget: "text" }
      - { label: "Illustration (Image IA)", name: "thumbnail", widget: "image", required: false }
      - { label: "Podcast Audio (MP3)", name: "podcast_audio", widget: "file", required: false }
      - { label: "Récit complet", name: "body", widget: "markdown" }
