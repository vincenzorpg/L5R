<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Création de Personnage Complète | Campagne L5R – MJ David</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-dark: #0c0a09;
      --card-bg: #171311;
      --gold: #d4af37;
      --crimson: #7f1d1d;
    }
    body {
      background-color: var(--bg-dark);
      color: #e7e5e4;
      font-family: 'Noto Serif JP', serif;
    }
    h1, h2, h3, .font-imperial {
      font-family: 'Cinzel', serif;
    }
    .panel {
      background-color: var(--card-bg);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 0.75rem;
    }
    .gold-text {
      color: var(--gold);
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      opacity: 1;
    }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; color: #000; }
      .panel { border: 1px solid #444; background: #fff; color: #000; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-16">

  <!-- BARRE SUPÉRIEURE FIXE : COMPTEUR XP & STATS EN TEMPS RÉEL -->
  <div class="sticky top-0 z-50 bg-stone-950/95 border-b border-amber-500/40 backdrop-blur px-4 py-2.5 shadow-xl">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <a href="index.html" class="no-print px-3 py-1 rounded bg-stone-900 hover:bg-stone-800 text-amber-300 border border-amber-500/30 text-xs font-bold">
          ← Accueil
        </a>
        <h1 class="text-sm md:text-lg font-bold gold-text tracking-wider">
          CRÉATION DE PERSONNAGE L5R
        </h1>
      </div>

      <!-- Résumé temps réel -->
      <div class="flex flex-wrap items-center gap-2 md:gap-4 text-xs">
        <div class="px-3 py-1 rounded bg-red-950/90 border border-amber-400/50">
          <span class="text-stone-300">XP Restants :</span>
          <span id="top-xp-left" class="text-base font-bold text-amber-300 ml-1">40</span>
          <span class="text-stone-400">/ <span id="top-xp-total">40</span></span>
        </div>
        <div class="px-2.5 py-1 rounded bg-stone-900 border border-stone-700">
          Réputation : <strong id="top-insight" class="text-amber-300">100</strong>
          (<span class="text-amber-400">Rang <strong id="top-rank">1</strong></span>)
        </div>
        <div class="px-2.5 py-1 rounded bg-stone-900 border border-stone-700">
          ND Armure : <strong id="top-armortn" class="text-emerald-400">15</strong>
        </div>
        <div class="px-2.5 py-1 rounded bg-stone-900 border border-stone-700">
          Initiative : <strong id="top-init" class="text-sky-300">3g2</strong>
        </div>
        <div class="px-2.5 py-1 rounded bg-stone-900 border border-stone-700">
          Honneur : <strong id="top-honor" class="text-amber-200">3.5</strong> |
          Gloire : <strong id="top-glory" class="text-amber-200">1.0</strong> |
          Statut : <strong id="top-status" class="text-amber-200">1.0</strong>
        </div>
      </div>
    </div>
  </div>

  <!-- CONTENU PRINCIPAL -->
  <main class="max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">

    <!-- BARRE DE SAUVEGARDE & LIENS WORDPRESS -->
    <div class="no-print panel p-4 flex flex-wrap items-center justify-between gap-3 text-xs">
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="saveCharacterLocal()" class="px-3 py-1.5 rounded bg-amber-600 hover:bg-amber-500 text-black font-bold transition">
          💾 Sauvegarder sur le navigateur
        </button>
        <select id="saved-chars-select" onchange="loadCharacterLocal(this.value)" class="px-2.5 py-1.5 rounded bg-stone-900 border border-stone-700 text-amber-200">
          <option value="">-- Charger un personnage sauvegardé --</option>
        </select>
        <button onclick="exportCharacterJSON()" class="px-3 py-1.5 rounded bg-stone-800 hover:bg-stone-700 text-amber-200 border border-stone-600">
          ⬇️ Exporter (.json)
        </button>
        <label class="px-3 py-1.5 rounded bg-stone-800 hover:bg-stone-700 text-amber-200 border border-stone-600 cursor-pointer">
          ⬆️ Importer (.json)
          <input type="file" accept=".json" onchange="importCharacterJSON
