name: Génération du Contexte Projet

on:
  push:
    branches:
      - main # ou master
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Compiler TOUS les fichiers du projet en un seul Markdown
        run: |
          OUTPUT="L5R_FULL_CONTEXT.md"
          echo "# État Complet du Projet L5R" > $OUTPUT
          echo "Date de génération : $(date)" >> $OUTPUT
          echo "" >> $OUTPUT

          # Parcourt automatiquement TOUS les fichiers textuels du projet
          # en excluant les dossiers cachés (.git, .github) et les fichiers binaires/images
          find . -type f \
            ! -path '/.github/' \
            ! -name 'L5R_FULL_CONTEXT.md' \
            ! -name '*.png' \
            ! -name '*.jpg' \
            ! -name '*.jpeg' \
            ! -name '*.gif' \
            ! -name '*.ico' \
            ! -name '*.zip' | sort | while read -r file; do
              echo "Traitement de : $clean_file"
              echo "## Fichier : $clean_file" >> $OUTPUT
              echo '```' >> $OUTPUT
              cat "$file" >> $OUTPUT
              echo "" >> $OUTPUT
              echo '```' >> $OUTPUT
              echo "" >> $OUTPUT
          done

      - name: Publier le fichier en artefact
        uses: actions/upload-artifact@v4
        with:
          name: contexte-l5r
          path: L5R_FULL_CONTEXT.md
