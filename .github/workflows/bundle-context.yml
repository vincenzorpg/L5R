name: Génération du Contexte Projet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Parcourir tous les répertoires et compiler
        run: |
          OUTPUT="L5R_FULL_CONTEXT.md"
          echo "# État Complet du Projet L5R" > "$OUTPUT"
          echo "Date de génération : $(date)" >> "$OUTPUT"
          echo "" >> "$OUTPUT"

          # 1. Lister l'arborescence complète en tête de fichier
          echo "## Arborescence du Dépôt" >> "$OUTPUT"
          echo '```text' >> "$OUTPUT"
          find . -maxdepth 3 -not -path '*/.*' -not -path './node_modules*' -not -path './dist*' | sort >> "$OUTPUT"
          echo '```' >> "$OUTPUT"
          echo "" >> "$OUTPUT"

          # 2. Parcourir et ajouter uniquement les fichiers texte
          while IFS= read -r -d '' file; do
            clean_file="${file#./}"

            # Filtrer les fichiers binaires pour ne pas corrompre le fichier avec des caractères nuls
            if [ -s "$file" ] && ! grep -qI '.' "$file"; then
              echo "Ignoré (binaire) : $clean_file"
              continue
            fi

            echo "Ajout de : $clean_file"
            echo "## Fichier : $clean_file" >> "$OUTPUT"
            # Utilisation de 4 backticks pour encapsuler du code et des fichiers .md sans collision
            echo '````' >> "$OUTPUT"
            cat "$file" >> "$OUTPUT"
            echo "" >> "$OUTPUT"
            echo '````' >> "$OUTPUT"
            echo "" >> "$OUTPUT"
          done < <(find . -type f \
            -not -path '*/.*' \
            -not -path './node_modules*' \
            -not -path './dist*' \
            -not -name 'L5R_FULL_CONTEXT.md' \
            -print0 | sort -z)

      - name: Publier le fichier en artefact
        uses: actions/upload-artifact@v4
        with:
          name: contexte-l5r
          path: L5R_FULL_CONTEXT.md
