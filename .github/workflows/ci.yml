name: CI — Tests & Hygiène du Site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Vérifier la syntaxe JavaScript
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find js data tests -type f -name '*.js' -print0)

      - name: Exécuter les tests unitaires
        run: node tests/unit-tests.js

      - name: Vérifier l'hygiène et les liens locaux
        run: node .github/scripts/check-site.js
