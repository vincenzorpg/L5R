name: 🎙️ Générer les Podcasts Audio (Edge TTS)

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Numéro(s) de scénario à générer ('all' ou ex: '11' ou '1,2,3')"
        required: true
        default: 'all'
        type: string
      force:
        description: "Régénérer même si le MP3 existe déjà"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  generate-podcasts:
    name: Synthèse Podcast Multi-Voix (Edge TTS + ffmpeg)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer ffmpeg et edge-tts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet edge-tts

      - name: Générer les épisodes Podcast MP3
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python3 scripts/generate_podcasts.py --scenario "${{ inputs.scenario }}" $FORCE_FLAG

      - name: Committer et pousser les fichiers audio générés
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/ data/podcasts-manifest.json
          if git diff --cached --quiet; then
            echo "Aucun nouveau fichier audio à committer."
          else
            git commit -m "audio(podcast): generate neural podcast episodes (${{ inputs.scenario }})"
            git push origin HEAD
          fi
